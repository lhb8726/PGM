[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgm-growth"
version = "0.1.0"
description = "Local personal growth planning desktop prototype"
requires-python = ">=3.10"
dependencies = ["PySide6==6.12.0"]

[project.scripts]
pgm = "pgm.app:main"

[tool.setuptools.packages.find]
include = ["pgm*"]

[tool.setuptools.package-data]
pgm = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
